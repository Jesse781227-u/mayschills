<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>May's Chills · Admin</title><style>
:root{--g:#159447;--ink:#17231c;--muted:#718079;--line:#e6eee8;--bg:#f5f8f5;--red:#b52d2d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,sans-serif}.shell{max-width:1240px;margin:auto;padding:28px 20px 60px}.top,.toolbar,.order-line{display:flex;justify-content:space-between;align-items:center;gap:16px}.top{margin-bottom:20px}.brand{font-size:25px;font-weight:800}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:5px}.panel,.item{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 25px #20452b0a}.panel{padding:24px}.login{max-width:410px;margin:12vh auto}.login h1{margin-top:0}.input{width:100%;padding:12px;border:1px solid #ccd9cf;border-radius:10px;font-size:15px;margin:6px 0 12px}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700;background:var(--g);color:white}.btn.secondary{background:#edf5ef;color:var(--g)}.btn.danger{background:#fff0f0;color:var(--red)}.hidden{display:none!important}.notice{color:var(--muted);font-size:13px;margin:5px 0 0}.nav{display:flex;gap:8px;margin:0 0 20px}.nav button.active{background:var(--g);color:#fff}.page{display:none}.page.active{display:block}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#edf8ef;color:var(--g);padding:10px 13px;border-radius:10px;font-weight:700}.group{margin-top:20px}.group summary{cursor:pointer;padding:4px 0;font-size:19px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:12px}.item{padding:16px}.item-head{display:flex;gap:13px;align-items:center}.item-image{width:82px;height:82px;object-fit:cover;border-radius:12px;background:#eef4ef}.item-name{font-weight:700;font-size:16px}.item-meta{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions .btn{font-size:12px;padding:8px 9px}.status{font-size:11px;border-radius:20px;padding:4px 8px;display:inline-block;margin-top:8px;background:#e8f7eb;color:var(--g)}.status.off{background:#fff2e3;color:#a85b00}.status.forever{background:#ffe9e9;color:var(--red)}.alert{padding:14px;margin-bottom:14px;border-radius:12px;background:#fff0d8;color:#8a4b00;font-weight:700}.order-card{margin-bottom:12px}.file-note{font-size:12px;color:var(--muted);display:block;margin-top:-6px;margin-bottom:8px}@media(max-width:620px){.top,.toolbar,.order-line{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1}.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell"><section id="login-panel" class="panel login"><h1>Admin access</h1><p class="notice">Manage orders and inventory.</p><form id="login-form"><label for="password">Admin password</label><input class="input" id="password" type="password" autocomplete="current-password" required><button class="btn" type="submit">Sign in</button></form><p id="login-error" class="notice" style="color:var(--red)"></p></section><section id="app" class="hidden"><div class="top"><div class="brand">May's Chills<small>Simple manager</small></div><button class="btn secondary" id="logout">Sign out</button></div><nav class="nav"><button class="btn active" data-page="orders-page">Orders</button><button class="btn secondary" data-page="inventory-page">Inventory</button></nav><section id="orders-page" class="page active"><div class="panel"><div class="toolbar"><div><h2 style="margin:0">Orders</h2><p class="notice">Review new orders and update their progress.</p></div><button class="btn secondary" id="refresh-orders">Refresh</button></div><div id="orders"><p class="notice">Loading orders…</p></div></div></section><section id="inventory-page" class="page"><div class="panel"><div class="toolbar"><div><h2 style="margin:0">Inventory</h2><p class="notice">Open a category to edit items or change stock.</p></div><div class="stats"><span class="stat" id="on-count">0 available</span><span class="stat" id="off-count">0 unavailable</span></div></div><div id="catalog"><p class="notice">Loading inventory…</p></div></div></section></section></main><iframe id="catalog-source" src="shop.html" class="hidden" title="Catalog source"></iframe><script>
const API_BASE=window.MAYCHILLS_API_URL||'https://mayschillsbackend.onrender.com',API=API_BASE+'/api';let token=sessionStorage.getItem('maychills_admin_token')||'',states={},catalog=null;const $=id=>document.getElementById(id);function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function mode(key){const state=states[key];if(!state)return'enabled';if(state.mode==='today'&&Number(state.expiresAt)<=Date.now())return'enabled';return state.mode;}async function request(path,options={}){const response=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});if(!response.ok)throw new Error('Request failed');return response.json();}function status(modeName){return modeName==='enabled'?'<span class="status">In stock</span>':modeName==='today'?'<span class="status off">Out today</span>':'<span class="status forever">Out until enabled</span>';}
function editor(item,type){const key=type+':'+item.id;return `<article class="item"><div class="item-head"><img class="item-image" src="${esc(item.image||'')}" alt="${esc(item.name||'')}" onerror="this.style.visibility='hidden'"><div><div class="item-name">${esc(item.name||item.id)}</div><div class="item-meta">${esc(item.category||'Other')} · ₦${Number(item.price||0).toLocaleString()}</div>${status(mode(key))}</div></div><details style="margin-top:14px"><summary style="cursor:pointer;color:var(--g);font-weight:700">Quick edit</summary><label class="notice">Item name<input class="input" data-field="name" value="${esc(item.name||'')}"></label><label class="notice">Price (₦)<input class="input" data-field="price" type="number" min="0" step="1" value="${esc(item.price??0)}"></label><label class="notice">Category<input class="input" data-field="category" value="${esc(item.category||'')}"></label><label class="notice">Paste image URL<input class="input" data-field="image-url" value="${esc(item.image||'')}" placeholder="https://…"></label><label class="notice">Or upload a new image<input class="input" data-field="image-file" type="file" accept="image/*"></label><span class="file-note">A selected image replaces the URL.</span><button class="btn" data-save="${esc(key)}">Save changes</button></details><div class="actions"><button class="btn secondary" data-key="${esc(key)}" data-mode="enabled">In stock</button><button class="btn" data-key="${esc(key)}" data-mode="today">Out today</button><button class="btn danger" data-key="${esc(key)}" data-mode="forever">Out until enabled</button></div></article>`;}
function renderInventory(){const groups={};catalog.products.forEach(item=>(groups[item.category||'Other']??=[]).push(item));const group=(name,items,type)=>`<details class="group"><summary>${esc(name)} <span class="notice">(${items.length})</span></summary><div class="grid">${items.map(item=>editor(item,type)).join('')}</div></details>`;$('catalog').innerHTML=Object.entries(groups).map(([name,items])=>group(name,items,'product')).join('')+group('Extras',catalog.extras,'extra');updateStats();document.querySelectorAll('[data-key]').forEach(button=>button.addEventListener('click',()=>updateAvailability(button.dataset.key,button.dataset.mode)));document.querySelectorAll('[data-save]').forEach(button=>button.addEventListener('click',()=>saveItem(button.dataset.save)));}function updateStats(){const total=catalog.products.length+catalog.extras.length,off=Object.keys(states).filter(key=>mode(key)!=='enabled').length;$('on-count').textContent=(total-off)+' available';$('off-count').textContent=off+' unavailable';}
function compressImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);if(file.size>5*1024*1024)return reject(new Error('Image must be smaller than 5MB.'));const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const scale=Math.min(1,1200/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.82));};image.onerror=()=>reject(new Error('Could not read image.'));image.src=reader.result;};reader.onerror=()=>reject(new Error('Could not read image.'));reader.readAsDataURL(file);});}async function saveItem(key){const card=document.querySelector(`[data-save="${CSS.escape(key)}"]`).closest('.item');const [type,id]=key.split(':'),collection=type==='product'?catalog.products:catalog.extras,existing=collection.find(item=>String(item.id)===id);try{const uploaded=await compressImage(card.querySelector('[data-field="image-file"]').files[0]),data={...existing,name:card.querySelector('[data-field="name"]').value.trim(),price:Number(card.querySelector('[data-field="price"]').value||0),category:card.querySelector('[data-field="category"]').value.trim(),image:uploaded||card.querySelector('[data-field="image-url"]').value.trim()};if(!data.name)throw new Error('Name is required');await request('/catalog',{method:'POST',body:JSON.stringify({key,data})});Object.assign(existing,data);renderInventory();}catch(error){alert(error.message);}}async function updateAvailability(key,selection){try{await request('/availability',{method:'POST',body:JSON.stringify({key,mode:selection})});if(selection==='enabled')delete states[key];else states[key]={mode:selection,expiresAt:selection==='today'?Date.now()+86400000:null};renderInventory();}catch(error){alert('Could not update stock.');}}
function renderOrders(orders){if(!orders.length){$('orders').innerHTML='<p class="notice">No paid orders yet.</p>';return;}$('orders').innerHTML=(orders.some(order=>order.attention_required)?'<div class="alert">Action required: an order needs preparation or a status update.</div>':'')+orders.map(order=>`<article class="item order-card"><div class="order-line"><div><div class="item-name">${esc(order.customer_name||'Customer')} · ${esc(order.order_type||'pickup')}</div><div class="item-meta">${esc(order.payment_reference)} · ${new Date(order.created_at).toLocaleString()}</div></div><strong>₦${Number(order.total||0).toLocaleString()}</strong></div><div class="item-meta" style="margin-top:10px">${(Array.isArray(order.items)?order.items:[]).map(item=>`${esc(item.quantity)}× ${esc(item.name)}`).join(' · ')}${order.delivery_area?' · '+esc(order.delivery_area):''}</div><div class="item-meta">${esc(order.delivery_phone||'')} · ${esc(order.customer_email||'')}</div><select class="input" data-order-status="${esc(order.payment_reference)}" style="width:auto;margin-top:12px"><option value="received">Received</option><option value="preparing">Preparing</option><option value="ready">Ready</option><option value="out_for_delivery">Out for delivery</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></article>`).join('');orders.forEach(order=>{const select=document.querySelector(`[data-order-status="${CSS.escape(order.payment_reference)}"]`);if(select){select.value=order.order_status||'received';select.addEventListener('change',()=>setOrderStatus(order.payment_reference,select.value));}});}async function setOrderStatus(reference,statusValue){try{await request('/admin/orders/'+encodeURIComponent(reference)+'/status',{method:'PATCH',body:JSON.stringify({status:statusValue})});await loadOrders();}catch(error){alert('Could not update order.');}}async function loadOrders(){try{renderOrders((await request('/admin/orders')).orders||[]);}catch(error){$('orders').innerHTML='<p class="notice" style="color:var(--red)">Unable to load orders.</p>';}}
async function start(){try{const source=$('catalog-source');if(!source.contentWindow.MAYCHILLS_CATALOG)await new Promise(resolve=>source.addEventListener('load',resolve,{once:true}));catalog=source.contentWindow.MAYCHILLS_CATALOG;const overrides=(await request('/catalog')).items||{};catalog.products=catalog.products.map(item=>({...item,...(overrides['product:'+item.id]||{})}));catalog.extras=catalog.extras.map(item=>({...item,...(overrides['extra:'+item.id]||{})}));states=(await request('/availability')).items||{};$('login-panel').classList.add('hidden');$('app').classList.remove('hidden');renderInventory();await loadOrders();}catch(error){sessionStorage.removeItem('maychills_admin_token');token='';$('login-error').textContent='Unable to load admin data. Check the backend connection.';}}document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-page]').forEach(item=>item.classList.toggle('active',item===button));document.querySelectorAll('.page').forEach(page=>page.classList.toggle('active',page.id===button.dataset.page));}));$('login-form').addEventListener('submit',async event=>{event.preventDefault();try{const data=await request('/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});token=data.token;sessionStorage.setItem('maychills_admin_token',token);await start();}catch(error){$('login-error').textContent='Invalid password or unavailable admin API.';}});$('logout').addEventListener('click',()=>{sessionStorage.removeItem('maychills_admin_token');location.reload();});$('refresh-orders').addEventListener('click',loadOrders);setInterval(()=>{if(token)loadOrders();},60000);if(token)start();
</script></body></html>
